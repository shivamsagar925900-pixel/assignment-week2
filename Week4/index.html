<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> Coding Club Student Registration</h1>
    </header>

    <main>
        <section>
            <h2>Student Registration Form</h2>
        
            <form action="#">

                <div>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name">
                </div>
                <br>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>
                <br>

                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter password">
                </div>
                <br>

                <div>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </div>
                <br>

                <div>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="1234567890">
                </div>
                <br>

                <div>
                    <label>Gender:</label>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
                <br>

                <div>
                    <label>Interests:</label>
                    <input type="checkbox" id="coding" name="interest" value="coding">
                    <label for="coding">Coding</label>
                    <input type="checkbox" id="web" name="interest" value="web">
                    <label for="web">Web Development</label>
                </div>
                <br>

                <div>
                    <label for="course">Select Course:</label>
                    <select id="course" name="course">
                        <option value="btech_cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="message">Message / About Yourself:</label><br>
                    <textarea id="message" name="message" rows="4" cols="30" placeholder="Type your message here..."></textarea>
                </div>
                <br>

                <div>
                    <input type="submit" value="Register Now">
                </div>
            </form>
        </section>
    </main>
    
</body>
</html>
