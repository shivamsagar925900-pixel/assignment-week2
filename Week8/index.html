<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid & Flexbox Layout</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Task 8.3: Grid Container with Named Areas -->
  <div class="grid-container">
    
    <header class="box area-head">
      <i class="fa-solid fa-heading"></i>
      <span>Header Area</span>
    </header>

    <aside class="box area-side">
      <i class="fa-solid fa-bars"></i>
      <span>Sidebar Area</span>
    </aside>

    <main class="main-content">
      <!-- Task 8.2: Responsive Auto-Fit Grid inside Main -->
      <div class="auto-grid">
        <div class="box">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </div>
        <div class="box">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </div>
        <div class="box">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </div>
        <div class="box">
          <i class="fa-solid fa-envelope"></i>
          <span>Messages</span>
        </div>
      </div>
    </main>

    <footer class="box area-foot">
      <i class="fa-solid fa-copyright"></i>
      <span>Footer Area</span>
    </footer>

  </div>

</body>
</html>
