<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid & Flexbox Exercise</title>
  <style>
    /* Reset & basic styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    /* 8.1 & 8.3: Grid Container setup with grid-template-areas, fr unit, and gap */
    .grid-container {
      display: grid;
      gap: 15px; /* 8.1: gap attribute */
      padding: 15px;
      min-height: 100vh;
      
      /* 8.1 & 8.3: Defining columns and template areas */
      grid-template-columns: 1fr 3fr; /* 8.1: fr unit */
      grid-template-areas: 
        "head head"
        "side main"
        "foot foot";
    }

    /* 8.3: Assigning named grid areas to elements */
    .header { grid-area: head; background-color: #3f51b5; color: white; }
    .sidebar { grid-area: side; background-color: #e0e0e0; }
    .main    { grid-area: main; background-color: #f5f5f5; }
    .footer  { grid-area: foot; background-color: #212121; color: white; }

    /* Common Box Styling */
    .box {
      padding: 20px;
      border-radius: 8px;
    }

    /* 8.2: Responsive Cards Grid inside Main content using auto-fit and minmax */
    .cards-container {
      display: grid;
      /* 8.2: Auto-rearrange layout */
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    /* 8.4: Inside each box, use Flexbox to align icon and text side-by-side */
    .card {
      background-color: #ffffff;
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 6px;
      
      /* Flexbox alignment */
      display: flex; /* 8.4: flexbox layout */
      align-items: center; /* Vertically center icon and text */
      gap: 10px; /* Space between icon and text */
    }

    .card-icon {
      font-size: 24px;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <header class="box header">
      <h2>Header Area</h2>
    </header>

    <aside class="box sidebar">
      <h3>Sidebar Area</h3>
    </aside>

    <main class="box main">
      <h2>Main Content Area</h2>

      <!-- 8.2 & 8.4: Cards grid showing auto-fit with flex items inside -->
      <div class="cards-container">
        <div class="card">
          <span class="card-icon">📁</span>
          <span>Files</span>
        </div>
        <div class="card">
          <span class="card-icon">⚙️</span>
          <span>Settings</span>
        </div>
        <div class="card">
          <span class="card-icon">👤</span>
          <span>Profile</span>
        </div>
        <div class="card">
          <span class="card-icon">🔔</span>
          <span>Notifications</span>
        </div>
      </div>
    </main>

    <footer class="box footer">
      <p>Footer Area</p>
    </footer>
  </div>

</body>
</html>
